name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check . ../scripts
      - run: uv run ruff format --check . ../scripts
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python ../scripts/check_repo.py
      - name: Quick start from the README
        run: uv run roverloom demo
      - name: Report and logs were written
        shell: bash
        run: |
          test -s ../runs/demo/report.html
          uv run roverloom score ../runs/demo/demo_traverse/replanner/seed-1
          uv run roverloom replay ../runs/demo/demo_traverse/replanner/seed-1 --at 100
      - run: uv run roverloom benchmark
      - run: uv run roverloom league verify
      - name: Offline league on public seeds
        run: uv run roverloom league run --league rover_design --out ../runs/league
      - name: Local mock submission
        run: uv run roverloom competition examples/submission --out ../runs/competition
      - name: Small scientific study
        run: uv run roverloom study --tracks misestimated_uncertainty --agents mission-planner,adaptive-planner --seeds 2 --out ../runs/study
