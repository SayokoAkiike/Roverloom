[project]
name = "roverloom"
version = "0.0.0"
description = "Python tooling for Roverloom. Currently contract tests only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["jsonschema>=4.23", "pytest>=8", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
